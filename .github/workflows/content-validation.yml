name: Validate portfolio content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "content-templates/**"
      - "app/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/content-validation.yml"
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
